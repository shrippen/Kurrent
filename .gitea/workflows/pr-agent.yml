name: pr-agent

# A second reader for pull requests: PR-Agent (qodo-ai/pr-agent) reviews a PR
# with another LLM when the owner comments /review on it, and posts its
# findings as a comment. No automatic run (owner, 18.10.2026).
#
# Needs the secret PR_AGENT_LLM_KEY and the variable PR_AGENT_MODEL (a
# LiteLLM model name, e.g. gpt-5.6, gemini/gemini-3.5-pro, or through
# OpenRouter openrouter/<vendor>/<model>). For a model PR-Agent does not
# know, the variable PR_AGENT_MODEL_TOKENS gives its context size.
# Comments come from the Actions bot; the secret PR_AGENT_GITEA_TOKEN sets
# an own user.
# Settings: .gitea/pr-agent/config.toml.
on:
  issue_comment:
    types: [created]

# A newer /review replaces a running one. Every other comment starts a run that skips;
# it gets a group of its own, so it cancels nothing. /review counts alone or with options
# after a space, so /reviewed cancels nothing either.
concurrency:
  group: pr-agent-${{ github.event.issue.number }}-${{ (github.event.issue.pull_request && github.event.comment.user.login == github.repository_owner && (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review '))) && 'review' || github.run_id }}
  cancel-in-progress: true

jobs:
  pr-agent:
    if: >-
      github.event.issue.pull_request &&
      github.event.comment.user.login == github.repository_owner &&
      (github.event.comment.body == '/review' || startsWith(github.event.comment.body, '/review '))
    timeout-minutes: 20
    runs-on: ubuntu-latest
    container: python:3.12-slim
    steps:
      # actions/checkout runs on Node.
      - name: Tools
        run: |
          apt-get update -qq
          DEBIAN_FRONTEND=noninteractive apt-get install -y -qq git nodejs >/dev/null
          pip install -q pr-agent==0.47.0

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: .gitea/pr-agent

      - name: PR-Agent
        env:
          PR_URL: ${{ github.server_url }}/${{ github.repository }}/pulls/${{ github.event.issue.number }}
          COMMAND: ${{ github.event.comment.body }}
          MODEL: ${{ vars.PR_AGENT_MODEL }}
          MODEL_TOKENS: ${{ vars.PR_AGENT_MODEL_TOKENS }}
          LLM_KEY: ${{ secrets.PR_AGENT_LLM_KEY }}
          GITEA_URL: ${{ github.server_url }}
          GITEA_TOKEN: ${{ secrets.PR_AGENT_GITEA_TOKEN || github.token }}
        run: .gitea/pr-agent/run.sh
