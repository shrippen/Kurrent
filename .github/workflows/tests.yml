# Checks bei jedem Push, auf allen Branches.
#
# Öffentlicher Spiegel: Gitea pusht jeden Branch und Tag bei jedem Commit hierher. Dieser
# Workflow prüft und meldet das Ergebnis an den Commit auf Gitea zurück, als Status
# "github / test"; dort liegen die Pull Requests. Auf GitHub gibt es keine Pull Requests,
# darum läuft alles auf push.
#
# Lokal bleibt der plasmoidviewer-Test (tests/plasmoidviewer_smoke.sh, braucht ein Display und das
# installierte Plugin) und alles, was echte Akonadi-Daten braucht.
#
# Braucht das Secret GITEA_TOKEN: ein Gitea-Token mit Schreibrecht auf das Repo
# (Commit-Status).
name: Tests

on:
  push:
    branches: ["**"]

# Keine Concurrency-Gruppe: Jeder Commit läuft zu Ende und behält seinen Status, ein neuerer
# Push bricht einen älteren Lauf nicht ab.

permissions:
  contents: read

env:
  GITEA_STATUS: https://git.arianw.de/api/v1/repos/shrippen/kurrent/statuses/${{ github.sha }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

jobs:
  unit:
    runs-on: ubuntu-latest
    outputs:
      started: ${{ steps.start.outputs.t }}
    steps:
      # Ein fehlender Status ist kein Grund, die Checks scheitern zu lassen.
      - id: start
        name: Report pending to Gitea
        run: |
          echo "t=$(date +%s)" >> "$GITHUB_OUTPUT"
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"pending\",\"context\":\"github / test\",\"description\":\"running\",\"target_url\":\"$RUN_URL\"}" \
            || echo "::warning::Gitea status not reported"
        env:
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}

      - name: Checkout
        uses: actions/checkout@v4

      - name: Skip full KDE build on Ubuntu
        run: |
          echo "Arch-native unit tests run locally via ctest (Akonadi/KF6)."
          echo "This job checks that test sources and the plasmoid packager stay valid."
          test -f tests/tasklogic_test.cpp
          test -f tests/calendar_test.cpp
          test -f tests/sharedsettings_test.cpp
          test -f tests/models_test.cpp
          chmod +x scripts/package-plasmoid.sh
          sudo apt-get update
          sudo apt-get install -y gettext zip python3
          scripts/package-plasmoid.sh
          python3 - <<'PY'
          import zipfile, glob
          zips = glob.glob("dist/*.plasmoid")
          assert zips, "no plasmoid artifact"
          z = zipfile.ZipFile(zips[0])
          names = z.namelist()
          assert "metadata.json" in names
          assert any(n.startswith("contents/") for n in names)
          print("packaged", zips[0], "entries", len(names))
          PY

  # Bauen und alle ctest-Tests, im Arch-Container (aktuelles Qt 6, KF6 und Akonadi wie auf dem
  # Entwicklungsrechner). TZ=Europe/Berlin: In UTC fallen Fehler um die Zeitumstellung nicht auf
  # (der Heatmap-Schnitt zählte den Oktober als 32 Tage). Lokal bleibt der plasmoidviewer-Test
  # (braucht ein Display und das installierte Plugin) und alles mit echten Akonadi-Daten.
  build:
    runs-on: ubuntu-latest
    container: archlinux:latest
    env:
      TZ: Europe/Berlin
      QT_QPA_PLATFORM: offscreen
    steps:
      - name: Tools
        run: |
          pacman -Syu --noconfirm --needed git nodejs base-devel cmake extra-cmake-modules tzdata \
            gettext qt6-base qt6-declarative qt6-svg kcalendarcore ki18n kconfig knotifications \
            kglobalaccel krunner akonadi kirigami libplasma
      - uses: actions/checkout@v4
      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Debug
      # Das Ziel kurrent-check (in all) führt die Unit-Tests aus.
      - name: Build and unit tests
        run: cmake --build build -j"$(nproc)"

  # Läuft auch, wenn unit oder build scheiterte oder abgebrochen wurde, damit auf Gitea kein
  # veraltetes "pending" stehen bleibt.
  report:
    needs: [unit, build]
    if: always()
    timeout-minutes: 5
    runs-on: ubuntu-latest
    steps:
      - name: Report result to Gitea
        run: |
          case "$RESULT" in
            success) state=success ;;
            failure) state=failure ;;
            *) state=error ;;
          esac
          desc=$RESULT
          if [ -n "$STARTED" ]; then desc="$RESULT in $(( ($(date +%s) - STARTED) / 60 )) min"; fi
          curl -fsS -X POST "$GITEA_STATUS" \
            -H "Authorization: token $GITEA_TOKEN" -H "Content-Type: application/json" \
            -d "{\"state\":\"$state\",\"context\":\"github / test\",\"description\":\"$desc\",\"target_url\":\"$RUN_URL\"}"
        env:
          RESULT: ${{ contains(needs.*.result, 'failure') && 'failure' || (contains(needs.*.result, 'cancelled') && 'cancelled' || needs.unit.result) }}
          STARTED: ${{ needs.unit.outputs.started }}
          GITEA_TOKEN: ${{ secrets.GITEA_TOKEN }}
